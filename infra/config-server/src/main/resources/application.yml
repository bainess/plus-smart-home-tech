server:
  port: 8888

spring:
  application:
    name: config-server
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/telemetry
            - file:./infra/config-repo/commerce