spring:
  main:
    banner-mode: off
    log-startup-info: false
  cloud:
    openfeign:
      client:
        config:
          default: # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000

logging:
  level:
    ru.yandex.practicum.telemetry: WARN
    org:
    springframework: ERROR
    apache.kafka: WARN
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG

kafka:
  bootstrap-servers: "localhost: 9092"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/