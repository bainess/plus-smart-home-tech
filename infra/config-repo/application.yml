spring:
  main:
    banner-mode: off
    log-startup-info: false
  cloud:
    openfeign:
      client:
        config:
          default: # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configuration:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600


logging:
  level:
    ru.yandex.practicum.telemetry: WARN
    org:
    springframework: ERROR
    apache.kafka: WARN
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG

kafka:
  bootstrap-servers: "localhost: 9092"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${random.value}